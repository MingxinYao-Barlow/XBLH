<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 西部陆海新通道商务与语言服务数据库</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-panel">
    <div class="login-left">
      <div class="login-brand">
        <img src="bannerSBS.jpg" alt="SBS" class="login-logo">
        <div class="login-title-group">
          <h1>西部陆海新通道</h1>
          <span>商务与语言服务数据库</span>
        </div>
      </div>
      <p class="login-slogan">服务国家战略  ·  赋能企业出海  ·  支撑学术研究</p>
    </div>

    <div class="login-right">
      <h2>用户登录</h2>
      <form id="loginForm" class="login-form">
        <div class="form-field">
          <label for="username">用户名</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" placeholder="请输入用户名或邮箱" autocomplete="username" required>
          </div>
        </div>
        <div class="form-field">
          <label for="password">密码</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="切换密码可见性">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8a19 19 0 0 1 5.06-5.94M9.9 4.24A10 10 0 0 1 12 4c7 0 11 8 11 8a19 19 0 0 1-2.2 3.2M1 1l22 22"/></svg>
            </button>
          </div>
        </div>
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember">
            <span class="checkmark"></span>
            记住登录
          </label>
          <a href="#" class="forgot-link">忘记密码？</a>
        </div>
        <button type="submit" class="login-btn">登 录</button>
        <p class="login-hint">演示站点 — 输入任意用户名和密码即可进入</p>
      </form>
    </div>
  </div>

  <footer class="login-footer">
    <p>四川外国语大学商务英语学院</p>
    <p>数据来源：国家统计局、海关总署、西部陆海新通道门户网站等官方公开渠道</p>
  </footer>
</div>

<script>
(function() {
  var togglePw = document.getElementById('togglePw');
  var pwInput = document.getElementById('password');
  var eyeOpen = togglePw.querySelector('.eye-open');
  var eyeClosed = togglePw.querySelector('.eye-closed');

  togglePw.addEventListener('click', function() {
    var isOpen = pwInput.type === 'password';
    pwInput.type = isOpen ? 'text' : 'password';
    eyeOpen.style.display = isOpen ? 'none' : '';
    eyeClosed.style.display = isOpen ? '' : 'none';
  });

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();
    if (!username || !password) {
      alert('请输入用户名和密码');
      return;
    }
    var btn = document.querySelector('.login-btn');
    btn.textContent = '登录中...';
    btn.disabled = true;
    setTimeout(function() {
      window.location.href = localStorage.setItem('nltc_auth', '1'); var params = new URLSearchParams(window.location.search); var redirect = params.get('redirect'); window.location.href = 'index.html' + (redirect ? '#' + redirect : '');
    }, 600);
  });
})();
</script>
</body>
</html>
